name: Release

# Publishes to npm with provenance when a v* tag is pushed.
#
# Authentication is npm "trusted publishing": npm trusts the GitHub Actions
# identity (this repository, this workflow file, the `npm` environment) via
# OIDC, so no npm token is stored anywhere. One-time setup on npmjs.com:
#   package depot-mcp > Settings > Trusted Publisher > GitHub Actions
#   owner akshayjain3450, repository depot-mcp, workflow release.yml, environment npm
#
# The tag must equal the version in package.json, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# Provenance and trusted publishing both need `id-token: write` and a public repository.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Tag must match package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node .github/scripts/check-metadata.mjs
      - run: node .github/scripts/mcp-smoke.mjs dist/index.js

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 bundles an older npm.
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Publish to npm (trusted publishing, no token)
        run: npm publish --provenance --access public

      - name: Print MCP registry follow-up
        run: |
          echo "Published. To update the MCP Registry entry, run locally:"
          echo "  mcp-publisher login github && mcp-publisher publish"
          echo "server.json already carries this version."
